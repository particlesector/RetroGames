# KITESONG: 8 KB, F8 (two 4 KB banks at $F000; the console starts in bank 1).
MEMORY {
    ZP:    start = $80,   size = $80,   type = rw;
    BANK0: start = $F000, size = $1000, fill = yes, fillval = $FF, file = %O;
    BANK1: start = $F000, size = $1000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    CODE0:    load = BANK0, type = ro;
    TRAMP0:   load = BANK0, type = ro, start = $FFE0;
    VEC0:     load = BANK0, type = ro, start = $FFF0;
    TABLES1:  load = BANK1, type = ro, start = $F000;
    CODE1:    load = BANK1, type = ro;
    TRAMP1:   load = BANK1, type = ro, start = $FFE0;
    VEC1:     load = BANK1, type = ro, start = $FFF0;
}
