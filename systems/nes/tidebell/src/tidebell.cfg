# TIDEBELL: MMC3 (mapper 4), 32 KB PRG, 16 KB CHR
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    RAM:  start = $0300, size = $0500, type = rw;
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:  start = $8000, size = $6000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRGF: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:  start = $0000, size = $4000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = PRG,  type = ro;
    RODATA:   load = PRG,  type = ro;
    FIXED:    load = PRGF, type = ro;
    VECTORS:  load = PRGF, type = ro, start = $FFFA;
    CHARS:    load = CHR,  type = ro;
}
