# DRYLINE: MMC3 (mapper 4), 128 KB PRG in sixteen 8 KB banks, 128 KB CHR, 8 KB battery RAM.
#   banks 0-1   race code, mapped at $8000 and $A000 while racing
#   bank  2     menu code at $8000
#   banks 4-7   circuit data at $A000 (two circuits per bank), copied out when a circuit loads
#   bank  8     music data at $A000
#   banks 14-15 fixed at $C000-$FFFF: reset, interrupts, loaders, sound driver
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw;
    RAM:   start = $0300, size = $0500, type = rw;
    SRAM:  start = $6000, size = $2000, type = rw;
    HDR:   start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    B0:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B1:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B2:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B3:    start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B4:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B5:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B6:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B7:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B8:    start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    B9:    start = $A000, size = $A000, type = ro, file = %O, fill = yes, fillval = $FF;
    FIX:   start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:   start = $0000, size = $20000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    SAVE:     load = SRAM, type = bss, optional = yes;
    HEADER:   load = HDR,  type = ro;
    RACE0:    load = B0,   type = ro;
    RACE1:    load = B1,   type = ro, optional = yes;
    MENU:     load = B2,   type = ro, optional = yes;
    TRK0:     load = B4,   type = ro;
    TRK1:     load = B5,   type = ro, optional = yes;
    TRK2:     load = B6,   type = ro, optional = yes;
    TRK3:     load = B7,   type = ro, optional = yes;
    MUSIC:    load = B8,   type = ro, optional = yes;
    CODE:     load = FIX,  type = ro;
    RODATA:   load = FIX,  type = ro;
    VECTORS:  load = FIX,  type = ro, start = $FFFA;
    CHARS:    load = CHR,  type = ro;
}
